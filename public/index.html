<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Небесная почта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#02040d;--fg:#e8ebff;--mut:#8e97c4;--gold:#f6d98f;--gold2:#e9a867;--rose:#f3a0bb;--star:#aebcff;--card:rgba(9,13,34,.94);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body::before,body::after{content:"";position:fixed;width:140vmax;height:140vmax;border-radius:50%;pointer-events:none;filter:blur(50px);opacity:.5}
body::before{left:-70vmax;top:-80vmax;background:radial-gradient(circle,#2a1a66 0,transparent 58%);animation:drift1 38s ease-in-out infinite alternate}
body::after{right:-80vmax;bottom:-90vmax;background:radial-gradient(circle,#0b3b6e 0,transparent 58%);animation:drift2 46s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.15)}}
#bg{position:fixed;inset:0;width:100%;height:100%}
.aur{position:fixed;left:-20%;right:-20%;top:18%;height:34vh;pointer-events:none;background:linear-gradient(100deg,transparent 10%,rgba(60,200,170,.10) 35%,rgba(120,90,255,.12) 60%,transparent 90%);filter:blur(34px);transform:skewY(-8deg);animation:aur 22s ease-in-out infinite alternate}
@keyframes aur{to{transform:skewY(-3deg) translateY(30px);opacity:.55}}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,6,.7) 100%);z-index:1}
.hills{position:fixed;left:0;right:0;bottom:0;height:16vh;pointer-events:none;z-index:1;background:linear-gradient(to top,#01020a 5%,rgba(1,2,10,0));}
.hills svg{position:absolute;inset:0;width:100%;height:100%}
.moon{position:fixed;top:calc(16px + env(safe-area-inset-top));right:20px;width:34px;height:34px;border-radius:50%;box-shadow:-9px 3px 0 0 #f1ead0;transform:rotate(-12deg);filter:drop-shadow(0 0 10px rgba(241,234,208,.55));z-index:2;animation:moon 8s ease-in-out infinite alternate;pointer-events:none}
@keyframes moon{to{filter:drop-shadow(0 0 18px rgba(241,234,208,.85))}}
header{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top)) 20px 0;pointer-events:none;text-align:center;z-index:2;animation:fadeDown 1s ease both}
h1{margin:0;font:600 28px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.5px;background:linear-gradient(90deg,#fff,var(--gold),#fff,var(--gold));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:-300% 0}}
header p{margin:8px auto 0;color:var(--mut);opacity:.9;font-size:13px;line-height:1.45;max-width:320px}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}
#sky{position:fixed;inset:0;z-index:1}
#ln{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#ln line{stroke:rgba(174,188,255,.22);stroke-width:1;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.st{position:absolute;transform:translate(-50%,-22px);width:88px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0;transition:left 1.4s cubic-bezier(.2,.8,.2,1),top 1.4s cubic-bezier(.2,.8,.2,1);animation:pop .8s cubic-bezier(.2,1.4,.4,1) backwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-22px) scale(0)}}
.sp{width:34px;height:34px;overflow:visible;fill:var(--star);filter:drop-shadow(0 0 7px rgba(185,196,255,.85));animation:twinkle 3.4s ease-in-out var(--d,0s) infinite;transition:transform .25s}
@keyframes twinkle{0%,100%{transform:scale(.88) rotate(0);opacity:.82}50%{transform:scale(1.08) rotate(8deg);opacity:1}}
.st:active .sp{transform:scale(1.35)}
.st.o .sp{fill:var(--gold);filter:drop-shadow(0 0 10px rgba(255,217,138,.95)) drop-shadow(0 0 22px rgba(255,184,107,.55))}
.st.o::before{content:"";position:absolute;top:17px;left:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:1px solid rgba(255,217,138,.7);animation:ring 2.8s ease-out var(--d,0s) infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.3);opacity:0}}
.st.hit .sp{animation:hit .7s ease}
@keyframes hit{40%{transform:scale(1.9);filter:drop-shadow(0 0 18px #fff)}}
.nm{font-size:13px;color:#d9ddff;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 8px #000,0 0 3px #000}
.st.me .nm{color:var(--gold);font-weight:600}
.st.me .nm::after{content:" · ты";font-weight:400;color:var(--mut)}
.bd{position:absolute;top:-4px;right:20px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:var(--rose);color:#2a0d1a;font-size:11px;font-weight:700;line-height:18px;text-align:center;display:none}
.st.o .bd{display:block}
footer{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(14px + env(safe-area-inset-bottom));text-align:center;color:var(--mut);font-size:13px;z-index:2;animation:fadeUp 1s .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
#sh{position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(3,5,16,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:5}
#sh.on{display:flex;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}}
.pan{width:100%;max-width:520px;max-height:82%;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .35s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.pan h2{margin:0 0 2px;font:600 24px Georgia,serif;color:var(--gold)}
.pan small{display:block;color:var(--mut);margin-bottom:14px}
.ltr{margin:0 0 10px;padding:13px 15px;border:1px solid rgba(255,217,138,.25);border-radius:16px;background:linear-gradient(160deg,rgba(255,217,138,.1),rgba(255,255,255,.03));line-height:1.5;animation:fadeUp .5s ease backwards;white-space:pre-wrap;word-break:break-word}
.ltr em{display:block;margin-top:7px;font-style:normal;font-size:12px;color:var(--rose)}
.empty{color:var(--mut);font-size:14px;margin:0 0 12px}
textarea{width:100%;min-height:92px;margin-top:6px;padding:13px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--fg);font:inherit;resize:none;outline:0}
textarea:focus{border-color:rgba(255,217,138,.6)}
#cc{display:block;text-align:right;color:var(--mut);font-size:12px;margin-top:4px}
.btn{font:inherit;font-size:15px;font-weight:600;color:#1a1305;background:linear-gradient(135deg,var(--gold),var(--gold2));border:0;border-radius:999px;padding:12px 22px;margin:10px 8px 0 0;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5}
.btn.g{color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:400}
#msg{margin-top:12px;font-size:14px;color:var(--rose);min-height:18px}
#gate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;background:rgba(5,8,24,.9);gap:18px}
#gate.on{display:flex}
#gate p{margin:0;max-width:300px;font-size:17px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(20,26,60,.95);border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.4s;z-index:8;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas><div class="aur"></div><div class="moon"></div><div class="vig"></div><div class="hills"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 100V62C40 48 70 40 110 52S180 78 230 56 330 30 400 50V100Z" fill="#01030b"/><path d="M0 100V80C60 66 110 74 170 82S300 66 400 76V100Z" fill="#000208"/></svg></div>
<header><h1>Созвездие МЭБ</h1></h1><p>Каждая звезда это человек с факультета. Выбери звезду и оставь для него доброе слово.</p></header>
<div id="sky"><svg id="ln"></svg></div>
<footer id="cnt"></footer>
<div id="toast"></div>
<div id="gate"><p id="gt"></p><button class="btn g" id="gc">Закрыть</button></div>
<div id="sh"><div class="pan"><div class="grab"></div><h2 id="pn"></h2><small id="ps"></small><div id="pl"></div>
<div id="cmp"><textarea id="tx" maxlength="300" placeholder="Напиши тёплое слово. Получатель не узнает автора, администратор не увидит, кто написал."></textarea><span id="cc">0/300</span>
<button class="btn" id="go">Отправить письмо</button></div><button class="btn g" id="cl">Закрыть</button><div id="msg"></div></div></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#050818');tg.setBackgroundColor('#050818')}catch(e){}}
const $=id=>document.getElementById(id),sky=$('sky'),ln=$('ln');
const ERR={auth:'Открой карту через бота в Telegram.',member:'Писать могут только участники группы.',limit:'Лимит: 5 писем в час.',bad:'Напиши хотя бы пару слов.',self:'Это твоя звезда. Выбери другую.',noname:'Сначала напиши боту своё имя.'};
const SPARK='<svg class="sp" viewBox="-12 -12 24 24"><path d="M0-11C1.2-3 3-1.2 11 0 3 1.2 1.2 3 0 11-1.2 3-3 1.2-11 0-3-1.2-1.2-3 0-11Z"/></svg>';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let people=[],letters=[],me=null,cur=null,first=true,sig='';
const els=new Map();

/* ---------- фон: звёзды и падающие звёзды ---------- */
const cv=$('bg'),cx=cv.getContext('2d');let W=0,H=0,bgStars=[],shoots=[];
function sizeBg(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  bgStars=Array.from({length:Math.round(W*H/5200)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.3,p:Math.random()*6.3,s:Math.random()*1.6+.4,a:Math.random()*.6+.3}))}
function frame(t){
  cx.clearRect(0,0,W,H);t/=1000;
  for(const s of bgStars){const a=s.a*(.55+.45*Math.sin(t*s.s+s.p));cx.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.283);cx.fill()}
  for(let i=shoots.length-1;i>=0;i--){const s=shoots[i];s.x+=s.vx;s.y+=s.vy;s.l--;
    const m=Math.hypot(s.vx,s.vy),tx=s.x-s.vx/m*110,ty=s.y-s.vy/m*110,g=cx.createLinearGradient(s.x,s.y,tx,ty);
    const al=Math.max(0,Math.min(1,s.l/50,(s.L-s.l)/40))*.85;g.addColorStop(0,'rgba(255,255,255,'+al+')');g.addColorStop(1,'rgba(255,255,255,0)');
    cx.strokeStyle=g;cx.lineWidth=2;cx.lineCap='round';cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(tx,ty);cx.stroke();
    if(s.l<=0)shoots.splice(i,1)}
  requestAnimationFrame(frame)
}
function shoot(){const dir=Math.random()<.5?1:-1,sp=3+Math.random()*1.6;
  shoots.push({x:dir>0?Math.random()*W*.5:W*.5+Math.random()*W*.5,y:-10+Math.random()*H*.3,vx:dir*sp,vy:sp*.5,l:190,L:190})}
function shootLoop(){if(!document.hidden&&!reduce)shoot();setTimeout(shootLoop,14000+Math.random()*16000)}
sizeBg();addEventListener('resize',()=>{sizeBg();render()});requestAnimationFrame(frame);setTimeout(shootLoop,5000);

/* ---------- расположение звёзд ---------- */
function layout(){
  const N=Math.max(people.length,1),cxm=innerWidth/2,cym=innerHeight*.55;
  const c=Math.min(54,(innerWidth/2-48)/Math.sqrt(N+.5)),rmax=c*Math.sqrt(N+.5);
  const ky=Math.max(1,Math.min(1.8,((innerHeight-200)/2)/rmax));
  return people.map((_,i)=>{const a=i*2.39996+.5,r=c*Math.sqrt(i+.5);return{x:cxm+r*Math.cos(a),y:cym+r*Math.sin(a)*ky}});
}
function render(){
  const pos=layout(),cnt={};letters.forEach(l=>cnt[l.to]=(cnt[l.to]||0)+1);
  const ids=new Set(people.map(p=>p.id));
  for(const[id,b]of els)if(!ids.has(id)){b.remove();els.delete(id)}
  people.forEach((p,i)=>{
    let b=els.get(p.id);
    if(!b){b=document.createElement('button');b.className='st';b.style.setProperty('--d',(Math.random()*3).toFixed(2)+'s');b.style.animationDelay=(first?i*90+300:0)+'ms';
      b.innerHTML=SPARK+'<span class="nm"></span><b class="bd"></b>';b.onclick=()=>openP(p.id);sky.appendChild(b);els.set(p.id,b)}
    b.style.left=pos[i].x+'px';b.style.top=pos[i].y+'px';
    b.querySelector('.nm').textContent=p.name+(p.g?' · '+p.g:'');b.querySelector('.bd').textContent=cnt[p.id]||'';
    b.classList.toggle('o',!!cnt[p.id]);b.classList.toggle('me',p.id===me);
  });
  let h='';for(let i=0;i<people.length-1;i++)h+=L(pos[i],pos[i+1],i);for(let i=0;i<people.length-3;i+=2)h+=L(pos[i],pos[i+3],i+.5);
  ln.innerHTML=h;
  $('cnt').textContent='Звёзд: '+people.length+'  ·  Писем на небе: '+letters.length;
  if($('sh').classList.contains('on'))fill();
}
const L=(a,b,i)=>'<line x1="'+a.x+'" y1="'+(a.y-5)+'" x2="'+b.x+'" y2="'+(b.y-5)+'" style="animation-delay:'+(.6+i*.12)+'s"/>';

/* ---------- панель письма ---------- */
function fill(){
  const p=people.find(x=>x.id===cur);if(!p){$('sh').classList.remove('on');return}
  const ls=letters.filter(l=>l.to===cur),mine=cur===me;
  $('pn').textContent=p.name;
  const gr=p.g?'Группа '+p.g+' · ':'';$('ps').textContent=mine?gr+'это твоя звезда · писем: '+ls.length:gr+'писем: '+ls.length;
  const pl=$('pl');pl.innerHTML='';
  if(!ls.length){const e=document.createElement('p');e.className='empty';e.textContent=mine?'Пока писем нет. Они появятся здесь, когда кто-то напишет тебе.':'Пока писем нет. Будь первым.';pl.appendChild(e)}
  ls.forEach((l,i)=>{const d=document.createElement('div');d.className='ltr';d.style.animationDelay=i*80+'ms';d.textContent=l.text;const e=document.createElement('em');e.textContent='✦ От тайного отправителя';d.appendChild(e);pl.appendChild(d)});
  $('cmp').style.display=mine?'none':'block';
}
function openP(id){cur=id;$('msg').textContent='';fill();$('sh').classList.add('on');if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light')}
const closeP=()=>$('sh').classList.remove('on');
$('cl').onclick=closeP;$('sh').onclick=e=>{if(e.target===$('sh'))closeP()};
$('tx').oninput=()=>$('cc').textContent=$('tx').value.length+'/300';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2800)}

/* ---------- полёт письма к звезде ---------- */
const fxc=document.createElement('canvas');fxc.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7';document.body.appendChild(fxc);
const fx=fxc.getContext('2d'),COL=['#ffd98a','#ff9fb8','#9fd8ff','#c9a8ff','#ffffff','#ffb86b','#8ff0d0'];
let fxOn=false,fxLast=0,comets=[],parts=[],rings=[],flashes=[];
function fxSize(){const d=Math.min(devicePixelRatio||1,2);fxc.width=innerWidth*d;fxc.height=innerHeight*d;fx.setTransform(d,0,0,d,0,0)}
fxSize();addEventListener('resize',fxSize);
const rnd=(a,b)=>a+Math.random()*(b-a);
function spark4(x,y,r,rot){fx.save();fx.translate(x,y);fx.rotate(rot);fx.beginPath();fx.moveTo(0,-r);fx.quadraticCurveTo(0,0,r,0);fx.quadraticCurveTo(0,0,0,r);fx.quadraticCurveTo(0,0,-r,0);fx.quadraticCurveTo(0,0,0,-r);fx.fill();fx.restore()}
function envelope(x,y,sc,rot,al){fx.save();fx.translate(x,y);fx.rotate(rot);fx.scale(sc,sc);fx.globalAlpha=al;
  fx.shadowColor='rgba(255,217,138,.95)';fx.shadowBlur=16;fx.fillStyle='#fff6df';fx.beginPath();(fx.roundRect||fx.rect).call(fx,-12,-8.5,24,17,3);fx.fill();fx.shadowBlur=0;
  fx.strokeStyle='#d9a441';fx.lineWidth=1.3;fx.beginPath();fx.moveTo(-12,-7);fx.lineTo(0,2.5);fx.lineTo(12,-7);fx.stroke();
  fx.fillStyle='#ff8fae';fx.beginPath();fx.arc(0,2.5,2.4,0,6.283);fx.fill();fx.restore()}
function fxStart(){if(!fxOn){fxOn=true;fxLast=performance.now();requestAnimationFrame(fxLoop)}}
function fxLoop(now){
  const dt=Math.min(50,now-fxLast);fxLast=now;fx.clearRect(0,0,innerWidth,innerHeight);
  /* вспышки */
  for(let i=flashes.length-1;i>=0;i--){const f=flashes[i],p=(now-f.t0)/f.dur;if(p>=1){flashes.splice(i,1);continue}
    const g=fx.createRadialGradient(f.x,f.y,0,f.x,f.y,100*(.4+p));g.addColorStop(0,'rgba(255,245,215,'+(.85*(1-p))+')');g.addColorStop(.4,'rgba(255,200,120,'+(.35*(1-p))+')');g.addColorStop(1,'rgba(255,200,120,0)');
    fx.fillStyle=g;fx.beginPath();fx.arc(f.x,f.y,100*(.4+p),0,6.283);fx.fill()}
  /* кольца */
  for(let i=rings.length-1;i>=0;i--){const r=rings[i],p=(now-r.t0)/r.dur;if(p<0)continue;if(p>=1){rings.splice(i,1);continue}
    fx.strokeStyle=r.col;fx.globalAlpha=1-p;fx.lineWidth=2.2*(1-p)+.5;fx.beginPath();fx.arc(r.x,r.y,8+r.max*(1-Math.pow(1-p,3)),0,6.283);fx.stroke();fx.globalAlpha=1}
  /* частицы */
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life+=dt;if(q.life>=q.max){parts.splice(i,1);continue}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;const a=1-q.life/q.max;fx.globalAlpha=a;fx.fillStyle=q.col;fx.shadowColor=q.col;fx.shadowBlur=8;
    if(q.st)spark4(q.x,q.y,q.r*(.6+a*.6),q.life/200);else{fx.beginPath();fx.arc(q.x,q.y,q.r*a+.3,0,6.283);fx.fill()}}
  fx.globalAlpha=1;fx.shadowBlur=0;
  /* кометы-письма */
  for(let i=comets.length-1;i>=0;i--){const c=comets[i],p=Math.min(1,(now-c.t0)/c.dur),u=-(Math.cos(Math.PI*p)-1)/2,v=1-u;
    const x=v*v*c.sx+2*v*u*c.cx+u*u*c.tx,y=v*v*c.sy+2*v*u*c.cy+u*u*c.ty;
    c.trail.push({x,y});if(c.trail.length>46)c.trail.shift();
    fx.lineCap='round';
    for(let k=1;k<c.trail.length;k++){const a=k/c.trail.length;fx.strokeStyle='hsla('+(285+a*115)%360+',100%,'+(70+a*10)+'%,'+(a*.75)+')';fx.lineWidth=a*6;fx.beginPath();fx.moveTo(c.trail[k-1].x,c.trail[k-1].y);fx.lineTo(c.trail[k].x,c.trail[k].y);fx.stroke()}
    for(let k=0;k<2;k++)parts.push({x:x+rnd(-4,4),y:y+rnd(-4,4),vx:rnd(-.02,.02),vy:rnd(-.02,.03),g:.00002,life:0,max:rnd(600,1200),r:rnd(1.2,3),col:COL[(Math.random()*COL.length)|0],st:Math.random()<.45});
    const fin=Math.max(0,(p-.82)/.18);
    const gl=fx.createRadialGradient(x,y,0,x,y,30);gl.addColorStop(0,'rgba(255,240,200,'+(.7*(1-fin))+')');gl.addColorStop(1,'rgba(255,200,120,0)');fx.fillStyle=gl;fx.beginPath();fx.arc(x,y,30,0,6.283);fx.fill();
    envelope(x,y,1-.65*fin,Math.sin(now/230)*.35,1-fin*.9);
    if(p>=1){comets.splice(i,1);arrive(c)}}
  if(comets.length||parts.length||rings.length||flashes.length)requestAnimationFrame(fxLoop);else{fxOn=false;fx.clearRect(0,0,innerWidth,innerHeight)}
}
function arrive(c){const now=performance.now();
  flashes.push({x:c.tx,y:c.ty,t0:now,dur:650});
  [0,140,300].forEach((d,k)=>rings.push({x:c.tx,y:c.ty,t0:now+d,dur:1000,max:46+k*22,col:COL[k]}));
  for(let i=0;i<46;i++){const a=rnd(0,6.283),sp=rnd(.04,.2);parts.push({x:c.tx,y:c.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.03,g:.00014,life:0,max:rnd(800,1500),r:rnd(1.6,4),col:COL[(Math.random()*COL.length)|0],st:Math.random()<.5})}
  if(c.b){c.b.classList.add('hit');setTimeout(()=>c.b.classList.remove('hit'),800)}
  if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('soft');
}
function flyTo(id,sx,sy){
  const b=els.get(id);if(!b)return;const r=b.querySelector('svg').getBoundingClientRect(),tx=r.left+r.width/2,ty=r.top+r.height/2;
  if(reduce){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),800);return}
  const mx=(sx+tx)/2,my=(sy+ty)/2,dx=tx-sx,dy=ty-sy,d=Math.hypot(dx,dy)||1,side=Math.random()<.5?-1:1,bend=Math.min(160,d*.35)*side;
  comets.push({sx,sy,tx,ty,cx:mx-dy/d*bend,cy:my+dx/d*bend,t0:performance.now(),dur:2400,trail:[],b});fxStart();
}

/* ---------- отправка ---------- */
$('go').onclick=async()=>{
  const text=$('tx').value.trim(),to=cur;$('go').disabled=true;
  try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:'',to,text})});
    const j=await r.json();
    if(j.e){$('msg').textContent=ERR[j.e]||'Не получилось отправить.'}
    else{$('tx').value='';$('cc').textContent='0/300';closeP();toast('Письмо ушло на проверку ✉');flyTo(to,innerWidth/2,innerHeight-30);if(tg&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success')}
  }catch(e){$('msg').textContent='Нет связи. Попробуй ещё раз.'}
  $('go').disabled=false;
};

/* ---------- данные ---------- */
function gate(e){$('gt').textContent=e==='noname'?'Твоей звезды ещё нет на карте. Вернись в чат с ботом и напиши в ответ своё имя.':(ERR[e]||'Что-то пошло не так.');$('gate').classList.add('on')}
$('gc').onclick=()=>{if(tg)tg.close();else $('gate').classList.remove('on')};
async function pull(){
  try{
    const r=await fetch('/api/letters',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?tg.initData:''})});
    const j=await r.json();
    if(j.e){gate(j.e);return}
    $('gate').classList.remove('on');
    const s=JSON.stringify([j.people,j.letters.map(l=>l.to+l.text),j.me]);if(s===sig)return;sig=s;
    const before={};letters.forEach(l=>before[l.to]=(before[l.to]||0)+1);
    people=j.people;letters=j.letters;me=j.me;render();
    if(!first){const now={};letters.forEach(l=>now[l.to]=(now[l.to]||0)+1);
      let k=0;for(const id in now)if(now[id]>(before[id]||0))setTimeout(()=>flyTo(id,Math.random()*innerWidth,-20),400*k++)}
    first=false;
  }catch(e){}
}
pull();setInterval(pull,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
</script>
</body>
</html>
